aid: gowork
name: GoWork
description: >-
  GoWork is Indonesia's largest premium coworking and flexible office space
  provider, operating more than 25 locations across Jakarta, Tangerang,
  Surabaya, Bali, and Medan. Formed from the 2018 merger of GoWork and Rework,
  the company offers private offices, dedicated desks, coworking memberships,
  virtual offices, meeting and event spaces, plus podcast and live-streaming
  studios. It also bundles business services such as company incorporation, tax
  and accounting, visa and work-permit processing, and legal support. Members
  discover, book, and manage workspace through the GoWork mobile apps and web
  booking platform. GoWork is backed by 500 Global and is tracked in the API
  Evangelist network as a company profile.
